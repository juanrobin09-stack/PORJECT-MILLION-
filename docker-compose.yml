services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      SONA_DATABASE_URL: postgresql+psycopg://sona:sona@db:5432/sona
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python -m sona.worker
    env_file: .env
    environment:
      SONA_DATABASE_URL: postgresql+psycopg://sona:sona@db:5432/sona
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sona
      POSTGRES_PASSWORD: sona
      POSTGRES_DB: sona
    volumes:
      - sona_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sona"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  sona_pg:
