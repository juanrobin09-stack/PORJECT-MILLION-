services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      RESONA_DATABASE_URL: postgresql+psycopg://resona:resona@db:5432/resona
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    environment:
      RESONA_DATABASE_URL: postgresql+psycopg://resona:resona@db:5432/resona
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resona
      POSTGRES_PASSWORD: resona
      POSTGRES_DB: resona
    volumes:
      - resona_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resona"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  resona_pg:
