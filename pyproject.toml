[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sona"
version = "2.0.0"
description = "Sona — the customer signal layer. One canonical schema for all customer feedback, AI enrichment, automations, and cross-industry benchmarks."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "anthropic>=0.50",
    "httpx>=0.27",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["sona*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.vercel]
entrypoint = "sona.main:app"
